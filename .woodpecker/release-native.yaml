when:
  - event: tag
matrix:
  LINKAGE:
    - dynamic
    - static
steps:
  - name: build
    image: ghcr.io/kasefuchs/containers/cmake:4.3.1
    commands:
      # Install dependencies
      - apt-get update --assume-yes
      - apt-get install --assume-yes libabsl-dev libcli11-dev libxxhash-dev nlohmann-json3-dev
      # Compile app
      - >-
        cmake -G Ninja -B cmake-build-${LINKAGE} -DBUILD_SHARED_LIBS=$([ "${LINKAGE}" = "static" ] && echo OFF || echo ON) -DCMAKE_BUILD_TYPE=Release -DKUSAI_INSTALL=ON -DKUSAI_BUILD_APP=ON
      - cmake --build cmake-build-${LINKAGE} --config Release
      # Package build
      - cd cmake-build-${LINKAGE}
      - cpack
  - name: publish
    image: woodpeckerci/plugin-release
    settings:
      title: ${CI_COMMIT_TAG}
      files:
        - cmake-build-*/dist/*
      api_key:
        from_secret: CODEBERG_RELEASE_API_TOKEN
